[tools]
opentofu = "1.13.1"
"github:opentofu/tofu-ls" = "0.5.3"

# kubectl should always match the k8s cluster minor version
# run `mise run update-k8s-version` to update this value to match the live cluster
kubectl = "1.34"

helm = "4"
k9s = "latest"
doctl = "1"
aws-cli = "2"
earthly = "0.8.16"

[env]
# Let us use `kubectl` with the DO k8s cluster.
# run `mise run get-kubeconfig` to generate this file
KUBECONFIG = "{{config_root}}/kubeconfig_do"

[tasks.update-k8s-version]
description = "Update the DO k8s cluster version in do-k8s.tf, and kubectl in mise.toml, to match the running cluster"
run = "scripts/update-k8s-version.sh"
tools = { jq = "1" }

[tasks.get-kubeconfig]
description = "Save the kubeconfig of the DO k8s cluster to kubeconfig_do"
run = "scripts/get-kubeconfig.sh"
